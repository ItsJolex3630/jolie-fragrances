<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Preview - Asad Elixir Bottle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #fff;
    background: #0a0a0a;
    transition: background 0.4s;
  }
  .toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .toolbar h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #d4af37;
  }
  .toolbar .controls {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .toolbar label {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
  }
  .color-btn {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s;
  }
  .color-btn:hover { transform: scale(1.15); }
  .color-btn.active { border-color: #d4af37; }
  .toggle-btn {
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .toggle-btn.on { background: #d4af37; color: #000; }
  .toggle-btn.off { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); }
  .toggle-btn.off:hover { background: rgba(255,255,255,0.2); }
  input[type="range"] {
    width: 100px;
    accent-color: #d4af37;
  }
  .main {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    min-height: 100vh;
    padding: 70px 40px 40px 40px;
  }
  .image-container {
    position: relative;
    transform-origin: center right;
    transition: transform 0.3s;
  }
  .image-container.grid-bg {
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .image-container img {
    max-height: 82vh;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 40px rgba(212,175,55,0.12));
  }
  .info {
    position: absolute;
    bottom: -30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    font-family: monospace;
    white-space: nowrap;
  }
  .info-panel {
    position: fixed;
    left: 20px;
    top: 70px;
    max-width: 280px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(212,175,55,0.12);
    border-radius: 16px;
    padding: 20px;
    backdrop-filter: blur(10px);
  }
  .info-panel h2 {
    font-size: 16px;
    color: #d4af37;
    margin-bottom: 6px;
  }
  .info-panel .brand {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .info-panel .detail {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 6px;
  }
  .info-panel .detail span {
    color: rgba(255,255,255,0.7);
  }
</style>
